name: Analyze & Deploy Dashboard

on:
  schedule:
    # every 15 minutes (UTC) + an offset copy (+3 min). GitHub's scheduler
    # frequently delays or skips cron slots, so the second schedule doubles
    # the chance that a slot actually runs on time.
    - cron: '*/15 * * * *'
    - cron: '3-59/15 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'analyzer/**'
      - 'config/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/*.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-cycle
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Golden parity test (JS engine vs Python reference)
        run: node tests/golden_js.test.js
      - name: Run market analysis
        run: python -m analyzer.run
        env:
          # optional Telegram alerts — undefined by default, never logged
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit updated data (race-proof)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the freshly computed data, then rebase onto the LATEST
          # remote before committing — concurrent runs (external scheduler +
          # GitHub schedule + manual dispatches) can commit between our
          # checkout and our push, which would otherwise reject the push.
          cp -r data /tmp/data_fresh
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/data_fresh/. data/
            git add data/
            if git diff --cached --quiet; then
              echo "no data changes — done"
              exit 0
            fi
            git commit -m "chore: market data refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if git push origin main; then
              echo "pushed successfully"
              exit 0
            fi
            echo "push rejected (concurrent commit detected) — retrying in 4s"
            sleep 4
          done
          echo "push failed after 3 attempts"
          exit 1
      - name: Notify failure (Telegram — optional)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python scripts/notify_failure.py
          else
            echo "no telegram secrets — skipping failure notification"
          fi

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # checkout the LATEST main (not the trigger SHA) so the freshly
      # committed data from the analyze job is included in the deployment
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: python scripts/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
