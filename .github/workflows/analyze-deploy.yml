name: Analyze & Deploy Dashboard

on:
  schedule:
    # every 15 minutes (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'analyzer/**'
      - 'config/**'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/*.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-cycle
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Run market analysis
        run: python -m analyzer.run
        env:
          # optional Telegram alerts — undefined by default, never logged
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: market data refresh $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # checkout the LATEST main (not the trigger SHA) so the freshly
      # committed data from the analyze job is included in the deployment
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: python scripts/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
